<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Paisa Tracker - Simple & Private Expense Tracker</title>
    <meta name="description" content="Simple, fast, and 100% private expense tracker that stores all financial data on your local device." />
    <meta property="og:title" content="Paisa Tracker - Simple & Private Expense Tracker" />
    <meta property="og:description" content="Simple, fast, and 100% private expense tracker that stores all financial data on your local device." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1E2C44" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Paisa Tracker" />

    <style>
      /* Completely suppress Netlify / Hosting badges, drawers, and floating pills */
      body > *:not(#root):not(script):not(style) {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        position: absolute !important;
        top: -99999px !important;
        left: -99999px !important;
        z-index: -99999 !important;
      }
      netlify-deploy-preview-badge,
      netlify-drawer,
      [data-netlify-deploy-preview-badge],
      #netlify-drawer,
      #netlify-identity-widget,
      iframe[src*="netlify"],
      div[class*="netlify"],
      div[id*="netlify"],
      .netlify-badge,
      [aria-label*="Netlify" i],
      [class*="netlify-drawer"],
      [id*="netlify" i],
      #vercel-toolbar,
      [data-vercel-toolbar] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased selection:bg-emerald-500/20">
    <div id="root" class="min-h-screen w-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
